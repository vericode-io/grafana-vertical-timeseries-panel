services:
  grafana:
    user: root
    container_name: 'vericode-verticaltimeseries-panel'

    build:
      context: .
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-13.2.4}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    ports:
      - 3001:3000/tcp
    volumes:
      - ../dist:/var/lib/grafana/plugins/vericode-verticaltimeseries-panel
      - ../provisioning:/etc/grafana/provisioning
      - ..:/root/vericode-custom-xychart

    environment:
      NODE_ENV: development
      GF_LOG_FILTERS: plugin.vericode-verticaltimeseries-panel:debug
      GF_LOG_LEVEL: debug
      GF_DATAPROXY_LOGGING: 1
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: vericode-verticaltimeseries-panel
      # Grafana 13: anonymous can only be Viewer; Admin role is ignored and /api/user 401s spam "Unauthorized".
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
